{% load static %}
<style>
nav.rsn{
  --pa:#3ddc97;--pa-soft:rgba(61,220,151,.12);
  --line:rgba(255,255,255,.09);--muted:rgba(255,255,255,.62);
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  position:sticky;top:0;z-index:50;
  background:rgba(6,6,7,.72);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  font-family:var(--mono);
  transition:background .25s,border-color .25s;
}
nav.rsn.scrolled{background:rgba(6,6,7,.9);border-bottom-color:rgba(255,255,255,.18)}

nav.rsn .rsn-in{
  position:relative;max-width:1120px;margin:0 auto;padding:0 24px;
  height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;
}

/* Brand: all white */
nav.rsn .rsn-brand{
  display:flex;align-items:center;gap:11px;flex-shrink:0;
  font-family:var(--mono);font-weight:800;font-size:17px;letter-spacing:-.01em;
  color:#fff;text-decoration:none;white-space:nowrap;
}
nav.rsn .rsn-brand img{
  width:34px;height:34px;display:block;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.35));
  transition:transform .3s cubic-bezier(.2,.8,.2,1),filter .3s;
}
nav.rsn .rsn-brand:hover img{transform:scale(1.08) rotate(-4deg);filter:drop-shadow(0 0 16px rgba(255,255,255,.6))}

/* Menu */
nav.rsn .rsn-menu{display:flex;align-items:center;gap:20px;margin-left:auto}
nav.rsn .rsn-links{
  display:flex;align-items:center;gap:4px;list-style:none;margin:0;padding:0;
  overflow:visible;max-width:none;font-size:13.5px;
}
nav.rsn .rsn-links li{margin:0;padding:0}
nav.rsn .rsn-links a{
  display:block;padding:8px 12px;border:0;border-radius:10px;
  color:var(--muted);text-decoration:none;font-family:var(--mono);
  transition:color .2s,background .2s;
}
nav.rsn .rsn-links a::before{content:"./";opacity:.45;color:var(--pa)}
nav.rsn .rsn-links a:hover{color:#fff;background:rgba(255,255,255,.06);border:0}
nav.rsn .rsn-links a.active{color:var(--pa);background:var(--pa-soft)}
nav.rsn .rsn-links a.active::before{opacity:.8}

nav.rsn .rsn-cta{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 18px;border-radius:10px;
  font-family:var(--mono);font-size:13.5px;font-weight:700;text-decoration:none;
  color:var(--pa);background:var(--pa-soft);border:1px solid rgba(61,220,151,.4);
  transition:all .2s;white-space:nowrap;
}
nav.rsn .rsn-cta:hover{
  color:#04140c;background:linear-gradient(135deg,#3ddc97,#22d3ee);
  border-color:transparent;transform:translateY(-1px);
  box-shadow:0 10px 24px -12px rgba(61,220,151,.7);
}
nav.rsn .rsn-cta.active{color:#04140c;background:linear-gradient(135deg,#3ddc97,#22d3ee);border-color:transparent}

/* Burger (hidden on desktop) */
nav.rsn .rsn-burger{
  display:none;width:42px;height:42px;padding:0;margin:0;cursor:pointer;
  align-items:center;justify-content:center;flex-direction:column;gap:5px;
  border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  transition:border-color .2s,background .2s;
}
nav.rsn .rsn-burger:hover{border-color:rgba(255,255,255,.35)}
nav.rsn .rsn-burger span{
  display:block;width:18px;height:2px;border-radius:2px;background:#fff;
  transition:transform .25s,opacity .2s;
}
nav.rsn.open .rsn-burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
nav.rsn.open .rsn-burger span:nth-child(2){opacity:0}
nav.rsn.open .rsn-burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
nav.rsn .rsn-burger:focus-visible,nav.rsn a:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Mobile */
@media (max-width:760px){
  nav.rsn .rsn-in{height:auto;min-height:60px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
  nav.rsn .rsn-menu{width:100%;flex-direction:column;align-items:stretch;gap:10px;margin-left:0}
  nav.rsn .rsn-links{flex-wrap:wrap}

  nav.rsn.rsn-js .rsn-in{height:60px;flex-wrap:nowrap;padding-top:0;padding-bottom:0}
  nav.rsn.rsn-js .rsn-burger{display:flex}
  nav.rsn.rsn-js .rsn-menu{
    position:absolute;left:0;right:0;top:100%;width:auto;
    padding:12px 24px 22px;gap:14px;
    background:rgba(6,6,7,.97);border-bottom:1px solid var(--line);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px);
    transition:opacity .2s,transform .25s,visibility .2s;
  }
  nav.rsn.rsn-js.open .rsn-menu{opacity:1;visibility:visible;pointer-events:auto;transform:none}
  nav.rsn.rsn-js .rsn-links{flex-direction:column;align-items:stretch;gap:2px}
  nav.rsn.rsn-js .rsn-links a{padding:13px 14px;font-size:15px}
  nav.rsn.rsn-js .rsn-cta{padding:13px 18px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  nav.rsn *,nav.rsn{transition:none !important}
}
</style>

<nav class="rsn" id="rsn" aria-label="Main">
  <div class="rsn-in">
    <a class="rsn-brand" href="{% url 'home' %}#home">
      <img src="{% static 'img/logo.png' %}" alt="">RadvanSec
    </a>

    <button class="rsn-burger" type="button" aria-label="Toggle menu" aria-controls="rsn-menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="rsn-menu" id="rsn-menu">
      <ul class="rsn-links">
        <li><a href="{% url 'home' %}#home">home</a></li>
        <li><a href="{% url 'home' %}#services">services</a></li>
        <li><a href="{% url 'blog:list' %}"{% if '/weblog/' in request.path %} class="active" aria-current="page"{% endif %}>blog</a></li>
        <li><a href="{% url 'cve_monitor:list' %}"{% if '/cve/' in request.path %} class="active" aria-current="page"{% endif %}>cve</a></li>
      </ul>
      {% if user.is_authenticated %}
        <a class="rsn-cta{% if '/dashboard/' in request.path %} active{% endif %}" href="{% url 'dashboard' %}">dashboard</a>
      {% else %}
        <a class="rsn-cta{% if '/accounts/' in request.path %} active{% endif %}" href="{% url 'account_login' %}">login</a>
      {% endif %}
    </div>
  </div>
</nav>

<script>
(function(){
  var n=document.getElementById('rsn');if(!n)return;
  var b=n.querySelector('.rsn-burger');
  n.classList.add('rsn-js');

  function set(o){n.classList.toggle('open',o);b.setAttribute('aria-expanded',o?'true':'false')}
  function onScroll(){n.classList.toggle('scrolled',window.scrollY>8)}

  b.addEventListener('click',function(){set(!n.classList.contains('open'))});
  n.querySelectorAll('.rsn-menu a').forEach(function(a){a.addEventListener('click',function(){set(false)})});
  document.addEventListener('click',function(e){if(!n.contains(e.target))set(false)});
  addEventListener('keydown',function(e){if(e.key==='Escape')set(false)});
  addEventListener('resize',function(){if(innerWidth>760)set(false)},{passive:true});
  addEventListener('scroll',onScroll,{passive:true});
  onScroll();
})();
</script>
