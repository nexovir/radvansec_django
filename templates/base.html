{% load static %}
<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RadvanSec{% endblock %}</title>
<meta name="description" content="{% block description %}RadvanSec - penetration testing, red teaming and security products.{% endblock %}">
<meta name="theme-color" content="#000000">
<link rel="icon" href="{% static 'img/logo.png' %}">

{% include "analytics.html" %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
{% block extra_head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
